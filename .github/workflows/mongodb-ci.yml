
name: MongoDB DBRE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-validation:
    name: Validate Bash Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        shell: bash
        run: |
          set -e
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done
          echo "All Bash syntax checks PASSED"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck linting
        shell: bash
        run: |
          shellcheck scripts/*.sh
          echo "All ShellCheck lint checks PASSED"

      - name: Validate test startup script
        run: |
          bash -n tests/start-replica-set.sh
          shellcheck tests/start-replica-set.sh

      - name: Start MongoDB replica set
        run: bash tests/start-replica-set.sh

      - name: Run MongoDB integration tests
        run: |
          docker exec -i atlas-migration-lab-mongo1-1 \
            mongosh --quiet --file /dev/stdin \
            < tests/replica-set-test.js

      - name: Clean up MongoDB containers
        if: always()
        run: docker compose -f docker/compose.yaml down -v
